plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Optional account for running the demo on a real catalog, read from the uncommitted
// local.properties: syte.accountId, syte.apiKey and syte.locale.
def localProperties = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProperties.load(it) }

android {
    namespace 'com.syte.ai.android_sdk.demo'
    compileSdk 37

    defaultConfig {
        applicationId "com.github.elnini0.sytedemo"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SYTE_ACCOUNT_ID", "\"${localProperties.getProperty('syte.accountId', '')}\""
        buildConfigField "String", "SYTE_API_KEY", "\"${localProperties.getProperty('syte.apiKey', '')}\""
        buildConfigField "String", "SYTE_LOCALE", "\"${localProperties.getProperty('syte.locale', 'en_US')}\""
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':syte-ui')

    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.13.0'

    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
