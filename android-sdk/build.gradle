plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.syte.ai.android_sdk'
    compileSdk 36

    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // Ship the library unshrunk; apps shrink it with consumer-rules.pro.
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId 'com.github.elnini0'
                artifactId 'syte-android-sdk'
                // JitPack passes the tag or commit being built as the version.
                version project.version == 'unspecified' ? '2.0.0' : project.version
            }
        }
    }
}

dependencies {

    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'com.squareup.retrofit2:retrofit:2.12.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.squareup.retrofit2:converter-gson:2.12.0'
    implementation 'com.github.Shouheng88:compressor:1.3.9'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
